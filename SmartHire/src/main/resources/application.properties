spring.application.name=SmartHire
# =============================
# DATABASE CONFIGURATION (H2)
# =============================
spring.datasource.url=jdbc:h2:mem:smarthire
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Affiche les requêtes SQL dans la console
spring.jpa.show-sql=true

# Met à jour automatiquement la structure de la base en fonction des entités
spring.jpa.hibernate.ddl-auto=update

# Console H2 activée pour debug (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================
# SERVER CONFIGURATION
# =============================
server.port=8080

# =============================
# SPRING JPA CONFIGURATION
# =============================
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect